<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Linkly</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar bg-dark navbar-dark mb-4"><div class="container"><a class="navbar-brand fw-bold" href="/">&#128279; Linkly</a></div></nav>
<div class="container" style="max-width:640px">
<div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
<div class="card shadow-sm mb-4"><div class="card-body">
  <h5 class="card-title">Shorten a URL</h5>
  <form th:action="@{/shorten}" method="post">
    <div class="mb-3"><label class="form-label">Long URL</label>
      <input name="url" class="form-control" placeholder="https://example.com/very/long/link" required></div>
    <div class="mb-3"><label class="form-label">Custom alias (optional)</label>
      <input name="alias" class="form-control" maxlength="20" placeholder="my-link">
      <div class="form-text">3-20 characters: letters, digits, hyphen, underscore.</div></div>
    <div class="mb-3"><label class="form-label">Expires</label>
      <select name="expiry" class="form-select">
        <option value="never">Never</option><option value="1h">1 hour</option>
        <option value="1d">1 day</option><option value="7d">7 days</option><option value="30d">30 days</option>
      </select></div>
    <button class="btn btn-primary w-100">Shorten</button>
  </form>
</div></div>
<div class="card shadow-sm" th:if="${!recent.isEmpty()}"><div class="card-body">
  <h6>Recent links</h6>
  <table class="table table-sm mb-0">
    <thead><tr><th>Code</th><th>Destination</th><th class="text-end">Visits</th></tr></thead>
    <tbody><tr th:each="l : ${recent}">
      <td><a th:href="@{/stats/{c}(c=${l.code})}" th:text="${l.code}"></a></td>
      <td class="text-truncate" style="max-width:260px" th:text="${l.targetUrl}"></td>
      <td class="text-end" th:text="${l.visits}"></td></tr></tbody>
  </table>
</div></div>
</div></body></html>
