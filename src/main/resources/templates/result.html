<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Linkly</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar bg-dark navbar-dark mb-4"><div class="container"><a class="navbar-brand fw-bold" href="/">&#128279; Linkly</a></div></nav>
<div class="container" style="max-width:640px">
<div class="card shadow-sm mb-3"><div class="card-body text-center">
  <h5 class="text-success">&#10003; Link created</h5>
  <div class="input-group my-3">
    <input id="short" class="form-control" readonly th:value="${shortUrl}">
    <button class="btn btn-outline-primary" type="button"
      onclick="navigator.clipboard.writeText(document.getElementById('short').value)">Copy</button>
  </div>
  <img th:src="@{/qr/{c}.png(c=${link.code})}" width="200" height="200" alt="QR code" class="border p-2 bg-white">
  <div class="mt-2"><a class="btn btn-sm btn-outline-secondary"
      th:href="@{/qr/{c}.png(c=${link.code})}" th:download="${link.code} + '-qr.png'">Download QR</a></div>
  <div class="mt-3">
    <a class="btn btn-primary" th:href="@{/{c}(c=${link.code})}" target="_blank">Open link</a>
    <a class="btn btn-outline-primary" th:href="@{/stats/{c}(c=${link.code})}">View stats</a>
    <a class="btn btn-outline-secondary" href="/">Shorten another</a>
  </div>
</div></div>
<div class="card shadow-sm"><div class="card-body small">
  <b>Original:</b> <span th:text="${link.targetUrl}"></span><br>
  <b>Expires:</b> <span th:text="${link.expiresAt != null ? #temporals.format(link.expiresAt, 'dd MMM yyyy HH:mm') : 'Never'}"></span>
</div></div>
</div></body></html>
