<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Linkly</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar bg-dark navbar-dark mb-4"><div class="container"><a class="navbar-brand fw-bold" href="/">&#128279; Linkly</a></div></nav>
<div class="container" style="max-width:640px">
<div class="card shadow-sm"><div class="card-body">
  <h5>Stats for <span th:text="${link.code}"></span>
    <span class="badge bg-danger" th:if="${link.expired}">Expired</span></h5>
  <table class="table mb-3">
    <tr><th>Short link</th><td th:text="${shortUrl}"></td></tr>
    <tr><th>Destination</th><td class="text-break" th:text="${link.targetUrl}"></td></tr>
    <tr><th>Created</th><td th:text="${#temporals.format(link.createdAt, 'dd MMM yyyy HH:mm')}"></td></tr>
    <tr><th>Expires</th><td th:text="${link.expiresAt != null ? #temporals.format(link.expiresAt, 'dd MMM yyyy HH:mm') : 'Never'}"></td></tr>
    <tr><th>Visits</th><td th:text="${link.visits}"></td></tr>
    <tr><th>Last visited</th><td th:text="${link.lastVisitedAt != null ? #temporals.format(link.lastVisitedAt, 'dd MMM yyyy HH:mm') : 'Not yet'}"></td></tr>
  </table>
  <a class="btn btn-outline-secondary" href="/">Back</a>
</div></div>
</div></body></html>
